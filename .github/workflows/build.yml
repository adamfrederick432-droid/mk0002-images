# Builds the fleet images on GitHub's runners and pushes them to GHCR, so the
# PC never pulls a 10+ GB CUDA base. This folder (moats/gpu/images in MK0002 OS)
# is the root of its own small repo. Tags must match roles.toml `image`
# (tests/test_gpu_images.py checks this).
name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gen
            tag: "0.39.0-r2"
          - image: llm
            tag: "0.40.0-r2"
    steps:
      # The gen image's CUDA/PyTorch base needs more room than a runner has free.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ghcr.io/${{ env.OWNER }}/mk0002-${{ matrix.image }}:${{ matrix.tag }}

      # Same check `gpu image smoke` runs locally: boot on CPU with an empty
      # /workspace and get an HTTP answer. Proves the image starts, not that the GPU works.
      - name: CPU smoke test
        run: |
          IMG=ghcr.io/${OWNER}/mk0002-${{ matrix.image }}:${{ matrix.tag }}
          if [ "${{ matrix.image }}" = gen ]; then
            docker run -d --name smoke -p 18188:18188 -e COMFY_LISTEN=0.0.0.0 -e COMFY_CPU=1 "$IMG"
            URL=http://localhost:18188/system_stats; WAIT=240
          else
            docker run -d --name smoke -p 11434:11434 -e OLLAMA_HOST=0.0.0.0:11434 "$IMG"
            URL=http://localhost:11434/api/version; WAIT=60
          fi
          for i in $(seq 1 $((WAIT / 3))); do
            if curl -sf "$URL"; then echo; echo "PASS after $((i * 3))s"; exit 0; fi
            sleep 3
          done
          docker logs --tail 50 smoke
          exit 1
